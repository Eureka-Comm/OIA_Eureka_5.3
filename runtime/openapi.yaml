openapi: 3.1.0
info:
  title: Eureka Multiverse Runtime API
  version: 0.3.0
  description: Eureka Multiverse 5.3 HTTP API. EM Core owns routing; specialist Skills preserve their cognitive ownership. Use an API key generated on the server with the Eureka API key CLI.
servers:
  - url: https://{domain}
    variables:
      domain:
        default: chat.example.com
security:
  - eurekaApiKey: []
paths:
  /api/v1/eureka/capabilities:
    get:
      summary: Read Eureka runtime capabilities
      responses:
        '200':
          description: Capability registry, including unavailable dependencies.
        '401':
          description: A valid Eureka API key is required.
  /api/v1/eureka/invocations:
    post:
      summary: Submit an invocation to EM Core
      description: The browser cannot choose a specialist directly. Core returns its routing and integrated result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
      responses:
        '200':
          description: Core response and trace identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreResponse'
        '403':
          description: Key scope is insufficient or direct specialist invocation is not allowed.
        '401':
          description: A valid Eureka API key is required.
        '503':
          description: Runtime, skill bundle, or model provider unavailable.
  /api/v1/tasks:
    post:
      summary: Create a persistent Eureka task
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                intent:
                  type: string
                  maxLength: 12000
      responses:
        '201':
          description: Task created with an initial TaskCreated event.
        '401':
          description: A valid Eureka API key is required.
        '409':
          description: Task ID already exists.
  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/taskId'
    get:
      summary: Read persistent task, transcript, and current interaction state
      responses:
        '200':
          description: Eureka task state.
        '401':
          description: A valid Eureka API key is required.
        '404':
          description: Task not found.
  /api/v1/tasks/{taskId}/messages:
    parameters:
      - $ref: '#/components/parameters/taskId'
    post:
      summary: Send a message to the task; EM Core routes the work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
      responses:
        '200':
          description: Core response and persisted task events.
        '401':
          description: A valid Eureka API key is required.
        '404':
          description: Task not found.
        '503':
          description: Runtime, skills, or provider unavailable.
  /api/v1/tasks/{taskId}/events:
    parameters:
      - $ref: '#/components/parameters/taskId'
    get:
      summary: Read task events after a sequence number
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Ordered task events.
        '401':
          description: A valid Eureka API key is required.
        '404':
          description: Task not found.
  /api/v1/tasks/{taskId}/formulations/propose:
    parameters:
      - $ref: '#/components/parameters/taskId'
    post:
      summary: Ask EM Structurer to propose a versioned task formulation
      description: Persists the proposal and a pending non-blocking Eureka-0 review gate. This endpoint cannot accept or reject a formulation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: string
                  maxLength: 12000
      responses:
        '201':
          description: Versioned proposal and pending review gate persisted.
        '401':
          description: A valid Eureka API key is required.
        '404':
          description: Task not found.
        '503':
          description: Runtime, EM Structurer Skill, or model provider unavailable.
components:
  securitySchemes:
    eurekaApiKey:
      type: http
      scheme: bearer
      bearerFormat: Eureka API key (euk_live_...)
  parameters:
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
  schemas:
    InvocationRequest:
      type: object
      required: [agent, task]
      properties:
        agent:
          type: string
          const: core
        task:
          type: string
          maxLength: 12000
        taskId:
          type: string
        formulationVersion:
          type: [string, 'null']
        input:
          description: Text and opaque input_file/input_image parts passed to the configured model provider.
          type: array
          items:
            type: object
    CoreResponse:
      type: object
      required: [invocationId, taskId, agent, status, product, routedAgents]
      properties:
        invocationId:
          type: string
        taskId:
          type: string
        agent:
          const: core
        status:
          type: string
        product:
          type: object
          properties:
            text:
              type: string
        routedAgents:
          type: array
          items:
            type: string
        routingReason:
          type: string
        trace:
          type: object
